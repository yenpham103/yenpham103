<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="260" viewBox="0 0 1000 260" role="img" aria-label="Yen Pham, Software Engineer, Applied AI">
<defs>
<linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6d28d9"/><stop offset="1" stop-color="#0e7490"/></linearGradient>
<linearGradient id="fade" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffffff" stop-opacity="1"/><stop offset="0.55" stop-color="#ffffff" stop-opacity="0.95"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></linearGradient>
<pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#eef1f4" stroke-width="1"/></pattern>
<style>
.edge{stroke:#d0d7de;stroke-width:1.5;stroke-dasharray:5 5;animation:flow 2.4s linear infinite}
.node{animation:pulse 2.7s ease-in-out infinite}
.tag{font:500 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;fill:#59636e}
@keyframes flow{to{stroke-dashoffset:-20}}
@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
</style>
</defs>
<rect x="1" y="1" width="998" height="258" rx="18" fill="#ffffff"/>
<rect x="1" y="1" width="998" height="258" rx="18" fill="url(#grid)"/>
<rect x="1" y="1" width="998" height="258" rx="18" fill="url(#fade)"/>
